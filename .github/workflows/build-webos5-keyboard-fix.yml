name: Build webOS 5 keyboard fix

on:
  push:
    branches:
      - fix/webos5-keyboard-input
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl file libwayland-bin \
            meson ninja-build pkg-config python3 wayland-protocols xz-utils

      - name: Download and relocate the matching webOS ARM SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /work/nc4/out
          sudo chown -R "$USER":"$USER" /work
          curl -fL --retry 3 \
            https://github.com/openlgtv/buildroot-nc4/releases/download/2026.08-webos/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz \
            -o /tmp/webos-sdk.tar.gz
          echo "2230a6351e5cce6fcb9d4fdcb4697335f223995401ef969c81744aaeb14c5344  /tmp/webos-sdk.tar.gz" | sha256sum -c -
          tar -xzf /tmp/webos-sdk.tar.gz -C /work/nc4/out
          compiler="$(find /work/nc4/out -name arm-webos-linux-gnueabi-gcc -print -quit)"
          test -n "$compiler"
          host_dir="$(dirname "$(dirname "$compiler")")"
          sdk_dir="$(dirname "$host_dir")"
          if [ -f "$sdk_dir/relocate-sdk.sh" ]; then
            (cd "$sdk_dir" && bash ./relocate-sdk.sh)
          fi
          if [ ! -e /work/nc4/out/host ]; then
            ln -s "$host_dir" /work/nc4/out/host
          fi
          test -x /work/nc4/out/host/bin/arm-webos-linux-gnueabi-gcc
          /work/nc4/out/host/bin/arm-webos-linux-gnueabi-gcc --version

      - name: Restore the known-good Firefox runtime from upstream release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/base-ipk
          curl -fL --retry 3 \
            https://github.com/gprot42/webos-firefox/releases/download/v0.1.29/com.github.gprot42.geckotv_0.1.29_arm.ipk \
            -o /tmp/firefox-base.ipk
          cd /tmp/base-ipk
          ar x /tmp/firefox-base.ipk
          mkdir -p root
          tar -xzf data.tar.gz -C root
          app_dir="root/usr/palm/applications/com.github.gprot42.geckotv"
          test -x "$app_dir/geckotv"
          test -x "$app_dir/firefox-runtime/firefox"
          rm -rf "$GITHUB_WORKSPACE/app"
          mkdir -p "$GITHUB_WORKSPACE/app"
          cp -a "$app_dir/." "$GITHUB_WORKSPACE/app/"

      - name: Build patched ARM32 Wayland adapter
        shell: bash
        run: |
          set -euo pipefail
          sudo ln -s "$GITHUB_WORKSPACE" /src
          CROSS=nc4 OUT="$GITHUB_WORKSPACE/app/firefox-runtime" \
            bash "$GITHUB_WORKSPACE/build/build-adapter.sh"
          file "$GITHUB_WORKSPACE/app/firefox-runtime/libwayland-client.so.0"
          readelf -h "$GITHUB_WORKSPACE/app/firefox-runtime/libwayland-client.so.0" | grep -E 'Class:|Machine:'
          bash "$GITHUB_WORKSPACE/build/nc4/glibc-check.sh" \
            "$GITHUB_WORKSPACE/app/firefox-runtime/libwayland-client.so.0"

      - name: Package upgraded IPK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/pack-ipk.py
          ipk="$(find dist -maxdepth 1 -name '*_arm.ipk' -print -quit)"
          test -s "$ipk"
          mkdir -p /tmp/ipk-check
          cd /tmp/ipk-check
          ar x "$GITHUB_WORKSPACE/$ipk"
          tar -tzf data.tar.gz | grep -q 'firefox-runtime/libwayland-client.so.0'
          echo "Built package: $ipk"
          sha256sum "$GITHUB_WORKSPACE/$ipk"

      - name: Upload installable IPK
        uses: actions/upload-artifact@v4
        with:
          name: firefox-webos5-keyboard-fix
          path: dist/*.ipk
          if-no-files-found: error
          retention-days: 30
